# RunConfig di esempio. Percorsi dati da adattare al dataset synThor esportato con:
#   python export_dataset.py -i output -o output/manifests.parquet \
#       --format parquet --val-fraction 0.1
# (oppure --format unsloth per dataset grandi, shardati su più file: il glob sotto
# copre entrambi i casi).

name: qwen3.5-manifest-extraction

data:
  train_files: "data/*_train*.parquet"
  validation_files: "data/*_validation*.parquet"
  max_samples: null
  seed: 0

model:
  model_id: "Qwen/Qwen3.5-0.8B"
  # Unsloth sconsiglia esplicitamente QLoRA 4-bit su Qwen3.5: quantizzazione nativa
  # 16-bit di default (vedi la guida ufficiale unsloth.ai/docs/models/qwen3.5/fine-tune).
  load_in_4bit: false
  max_seq_length: 2048

lora:
  # false = full fine-tuning (nessun adapter, tutti i pesi allenabili). Vedi README
  # per come passare a full fine-tuning con --set lora.enabled=false.
  enabled: true
  r: 16
  alpha: 16
  dropout: 0.0
  # null = usa la lista standard di moduli Qwen (q/k/v/o_proj, gate/up/down_proj)
  # definita in trainmaster/model.py.
  target_modules: null

training:
  output_dir: "runs/default"
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_ratio: 0.03
  eval_strategy: "steps"
  eval_steps: 50
  save_steps: 50
  bf16: true
  seed: 0

evaluation:
  enabled: true
  max_new_tokens: 1024
  numeric_tolerance: 0.01
  sample_limit: null

report:
  enabled: true
  max_examples: 40
