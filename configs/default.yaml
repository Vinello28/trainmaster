# RunConfig di esempio. Percorsi dati da adattare al dataset synThor esportato con:
#   python export_dataset.py -i output -o output/manifests.parquet \
#       --format parquet --val-fraction 0.1
# (oppure --format unsloth per dataset grandi, shardati su più file: il glob sotto
# copre entrambi i casi).

name: codex

data:
  train_files: "data/*_train*.parquet"
  validation_files: "data/*_validation*.parquet"
  max_samples: null
  seed: 0

model:
  # TODO: verificare che questo model_id sia disponibile per FastVisionModel.from_pretrained
  # nella versione di unsloth installata. "qwen3.5 0.8B" non è un repo id verificabile:
  # questo è il piccolo Qwen-VL più vicino tra quelli noti come supportati da Unsloth.
  model_id: "unsloth/Qwen2-VL-2B-Instruct-bnb-4bit"
  load_in_4bit: true
  max_seq_length: 2048
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: null

training:
  output_dir: "runs/default"
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_ratio: 0.03
  eval_strategy: "steps"
  eval_steps: 50
  save_steps: 50
  bf16: true
  seed: 0

evaluation:
  enabled: true
  max_new_tokens: 1024
  numeric_tolerance: 0.01
  sample_limit: null

report:
  enabled: true
  max_examples: 40
